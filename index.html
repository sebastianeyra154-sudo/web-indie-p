<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Steam | Gaming Platform</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --steam-dark: #171a21;
            --steam-navy: #1b2838;
            --steam-blue: #66c0f4;
            --steam-btn-green: #5c7e10;
            --steam-btn-hover: #90ba3c;
            --panel-bg: rgba(20, 31, 44, 0.9);
            --panel-border: rgba(102, 192, 244, 0.2);
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --text-main: #c7d5e0;
            --text-white: #ffffff;
            --text-muted: #626378;
            --success-green: #4caf50;
            --font-display: 'Orbitron', sans-serif;
            --font-sans: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background-color: var(--steam-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        html, body { cursor: crosshair; }
        a, button, input, select, label { cursor: pointer; }

        /* EFECTOS DE FONDO */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(102, 192, 244, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 192, 244, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            pointer-events: none;
        }

        .crt-scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 9999;
            pointer-events: none;
        }

        .crt-scanlines.disabled {
            display: none !important;
        }

        /* NAVEGACIÓN */
        .steam-client-nav {
            background-color: var(--steam-dark);
            border-bottom: 2px solid var(--steam-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            z-index: 100;
        }

        .steam-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            color: var(--steam-blue);
            letter-spacing: 2px;
        }

        .steam-tabs {
            display: flex;
            gap: 25px;
        }

        .steam-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 16px;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .steam-tab:hover {
            color: var(--text-white);
        }

        .steam-tab.active {
            color: var(--steam-blue);
            border-bottom-color: var(--steam-blue);
        }

        .steam-client-settings {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .client-select, .btn-client-crt {
            background: #141f30;
            color: var(--steam-blue);
            border: 1px solid rgba(102, 192, 244, 0.3);
            border-radius: 4px;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-client-crt:hover {
            border-color: var(--steam-blue);
            background: rgba(102, 192, 244, 0.1);
        }

        /* CONTENEDOR PRINCIPAL */
        .client-content-view {
            display: none;
            flex: 1;
            width: 100%;
            padding: 25px 30px;
            overflow-y: auto;
            z-index: 10;
        }

        .client-content-view.active {
            display: flex;
        }

        /* TIENDA */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(23, 26, 33, 0.9);
            border: 1px solid rgba(102, 192, 244, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .game-card:hover {
            border-color: var(--steam-blue);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 192, 244, 0.2);
        }

        .game-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #66c0f4, #1b2838);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
        }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-title {
            font-family: var(--font-display);
            font-weight: bold;
            color: var(--text-white);
        }

        .game-price {
            color: var(--steam-btn-green);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-add-cart {
            background: var(--steam-btn-green);
            color: var(--text-white);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-add-cart:hover {
            background: var(--steam-btn-hover);
        }

        /* BIBLIOTECA */
        .library-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .library-header h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-white);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .game-library-item {
            background: rgba(23, 26, 33, 0.8);
            border: 2px solid rgba(102, 192, 244, 0.15);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-library-item:hover {
            border-color: var(--steam-blue);
            background: rgba(102, 192, 244, 0.05);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .game-name {
            font-family: var(--font-display);
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 5px;
        }

        .game-playtime {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* CANVAS PARA JUEGOS */
        .game-canvas-container {
            background: #000;
            border: 2px solid var(--steam-blue);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        canvas {
            border: 3px solid var(--steam-blue);
            background: #0a0a0a;
            display: block;
        }

        .game-controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-control {
            background: var(--steam-btn-green);
            color: var(--text-white);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-control:hover {
            background: var(--steam-btn-hover);
        }

        /* CHAT */
        .community-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .chat-window {
            background: rgba(23, 26, 33, 0.95);
            border: 1px solid rgba(102, 192, 244, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
        }

        .chat-header {
            background: #10121a;
            border-bottom: 1px solid rgba(102, 192, 244, 0.1);
            padding: 15px 20px;
            font-family: var(--font-display);
            color: var(--text-white);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .chat-message.user {
            align-self: flex-end;
            background: rgba(102, 192, 244, 0.2);
            color: var(--text-white);
        }

        .chat-message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .chat-input-area {
            background: #10121a;
            border-top: 1px solid rgba(102, 192, 244, 0.1);
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 192, 244, 0.2);
            color: var(--text-white);
            padding: 10px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--steam-blue);
        }

        .btn-send {
            background: var(--steam-blue);
            color: var(--steam-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* PERFIL */
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(23, 26, 33, 0.95);
            border: 1px solid rgba(102, 192, 244, 0.2);
            border-radius: 12px;
            padding: 30px;
        }

        .profile-header {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 30px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--steam-blue), var(--neon-pink));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--text-white);
            margin-bottom: 10px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-box {
            background: rgba(102, 192, 244, 0.05);
            border: 1px solid rgba(102, 192, 244, 0.2);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--steam-blue);
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--steam-dark);
            border: 2px solid var(--steam-blue);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-family: var(--font-display);
            color: var(--text-white);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .btn-close:hover {
            color: var(--text-white);
        }

        @media (max-width: 768px) {
            .steam-tabs {
                gap: 10px;
                font-size: 0.7rem;
            }

            .store-grid, .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .profile-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="crtOverlay" class="crt-scanlines"></div>

    <nav class="steam-client-nav">
        <div class="steam-brand">🎮 INDIE STEAM</div>
        <div class="steam-tabs">
            <button class="steam-tab active" onclick="switchTab('tienda')">TIENDA</button>
            <button class="steam-tab" onclick="switchTab('biblioteca')">BIBLIOTECA</button>
            <button class="steam-tab" onclick="switchTab('comunidad')">COMUNIDAD</button>
            <button class="steam-tab" onclick="switchTab('perfil')">PERFIL</button>
        </div>
        <div class="steam-client-settings">
            <select id="clientTheme" class="client-select">
                <option value="default">STEAM NAVY</option>
                <option value="dark">CYBER MODE</option>
            </select>
            <button id="crtBtn" class="btn-client-crt" onclick="toggleCRT()">CRT: ON</button>
        </div>
    </nav>

    <!-- TIENDA -->
    <div id="tienda" class="client-content-view active">
        <div style="width: 100%;">
            <h2 style="font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 20px; color: var(--text-white);">🛍️ TIENDA - JUEGOS DISPONIBLES</h2>
            <div class="store-grid" id="storeGrid"></div>
        </div>
    </div>

    <!-- BIBLIOTECA -->
    <div id="biblioteca" class="client-content-view">
        <div class="library-container" style="width: 100%;">
            <div class="library-header">
                <h2>📚 MI BIBLIOTECA</h2>
                <span style="color: var(--text-muted); font-size: 0.9rem;" id="gameCount">0 JUEGOS</span>
            </div>
            <div class="games-grid" id="libraryGrid"></div>
            <div id="gamePlayContainer" style="display: none; margin-top: 30px;"></div>
        </div>
    </div>

    <!-- COMUNIDAD -->
    <div id="comunidad" class="client-content-view">
        <div class="community-container">
            <h2 style="font-family: var(--font-display); font-size: 1.3rem; color: var(--text-white);">💬 COMUNIDAD - CHAT CON GÉMINI</h2>
            <div class="chat-window">
                <div class="chat-header">Asistente Indie Steam</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Escribe tu pregunta..." onkeypress="handleChatKeypress(event)">
                    <button class="btn-send" onclick="sendChatMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PERFIL -->
    <div id="perfil" class="client-content-view">
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <div class="profile-info">
                    <h2>SteamDeck Gamer</h2>
                    <p style="color: var(--text-muted); margin-bottom: 10px;">Indie Productions Player</p>
                    <div style="display: flex; gap: 10px;">
                        <span style="background: rgba(102, 192, 244, 0.1); padding: 4px 12px; border-radius: 4px; font-size: 0.8rem;">Level 15</span>
                        <span style="background: rgba(76, 175, 80, 0.1); padding: 4px 12px; border-radius: 4px; font-size: 0.8rem;">✓ Activo</span>
                    </div>
                </div>
            </div>

            <h3 style="font-family: var(--font-display); color: var(--text-white); margin-bottom: 15px;">ESTADÍSTICAS</h3>
            <div class="profile-stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalPlaytime">0</div>
                    <div class="stat-label">HORAS JUGADAS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">JUEGOS EN BIBLIOTECA</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="achievements">0</div>
                    <div class="stat-label">LOGROS DESBLOQUEADOS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="levelDisplay">15</div>
                    <div class="stat-label">NIVEL DE PERFIL</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA JUEGOS -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalGameTitle">Juego</h2>
                <button class="btn-close" onclick="closeGameModal()">✕</button>
            </div>
            <div id="modalGameBody"></div>
        </div>
    </div>

    <script>
        // DATOS DE JUEGOS
        const games = {
            snake: {
                name: 'SNAKE ARCADE',
                icon: '🐍',
                price: 'GRATIS',
                description: 'Clásico juego de serpiente. Come manzanas y evita tocarte.',
                hasGame: true,
                playtime: 0
            },
            galaga: {
                name: 'GALAGA RETRO',
                icon: '👾',
                price: 'GRATIS',
                description: 'Defensa espacial retro. Dispara a los enemigos.',
                hasGame: true,
                playtime: 0
            },
            breakout: {
                name: 'BREAKOUT CLASSIC',
                icon: '🧱',
                price: 'GRATIS',
                description: 'Juego de ladrillos. Golpea con la paleta.',
                hasGame: true,
                playtime: 0
            },
            flappy: {
                name: 'FLAPPY BIRD',
                icon: '🐦',
                price: 'GRATIS',
                description: 'Vuela entre obstáculos. Toca para saltar.',
                hasGame: true,
                playtime: 0
            },
            pong: {
                name: 'PONG LEGEND',
                icon: '🎾',
                price: 'GRATIS',
                description: 'El juego más antiguo. Juega contra la IA.',
                hasGame: true,
                playtime: 0
            }
        };

        let userLibrary = [];
        let currentGame = null;
        let gameLoops = {};

        // SWITCH DE TABS
        function switchTab(tabName) {
            document.querySelectorAll('.client-content-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.steam-tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'tienda') loadStore();
            if (tabName === 'biblioteca') loadLibrary();
            if (tabName === 'perfil') loadProfile();
        }

        // CARGAR TIENDA
        function loadStore() {
            const storeGrid = document.getElementById('storeGrid');
            storeGrid.innerHTML = '';

            Object.entries(games).forEach(([key, game]) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-thumbnail">${game.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${game.description}</p>
                        <div class="game-price">${game.price}</div>
                        <button class="btn-add-cart" onclick="addToLibrary('${key}')">Agregar a Biblioteca</button>
                    </div>
                `;
                storeGrid.appendChild(card);
            });
        }

        // AGREGAR A BIBLIOTECA
        function addToLibrary(gameKey) {
            if (!userLibrary.includes(gameKey)) {
                userLibrary.push(gameKey);
                alert(`${games[gameKey].name} agregado a tu biblioteca!`);
                loadLibrary();
            }
        }

        // CARGAR BIBLIOTECA
        function loadLibrary() {
            const libraryGrid = document.getElementById('libraryGrid');
            libraryGrid.innerHTML = '';

            if (userLibrary.length === 0) {
                libraryGrid.innerHTML = '<p style="grid-column: 1/-1; color: var(--text-muted); text-align: center;">No tienes juegos. ¡Ve a la tienda!</p>';
            }

            userLibrary.forEach(gameKey => {
                const game = games[gameKey];
                const item = document.createElement('div');
                item.className = 'game-library-item';
                item.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-name">${game.name}</div>
                    <div class="game-playtime" id="playtime-${gameKey}">${game.playtime}h</div>
                    <button class="btn-control" style="width: 100%; margin-top: 8px;" onclick="playGame('${gameKey}')">JUGAR</button>
                `;
                libraryGrid.appendChild(item);
            });

            document.getElementById('gameCount').textContent = `${userLibrary.length} JUEGOS`;
        }

        // JUGAR JUEGO
        function playGame(gameKey) {
            currentGame = gameKey;
            const game = games[gameKey];
            const modalBody = document.getElementById('modalGameBody');
            document.getElementById('modalGameTitle').textContent = game.name;

            modalBody.innerHTML = `
                <div class="game-canvas-container">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                    <div class="game-controls">
                        <button class="btn-control" onclick="startGame()">INICIAR</button>
                        <button class="btn-control" onclick="pauseGame()">PAUSA</button>
                        <button class="btn-control" onclick="closeGameModal()">SALIR</button>
                    </div>
                    <div id="gameInfo" style="color: var(--text-muted); text-align: center; font-size: 0.9rem;"></div>
                </div>
            `;

            document.getElementById('gameModal').classList.add('active');
            setTimeout(() => initGame(gameKey), 100);
        }

        // INICIALIZAR JUEGOS
        function initGame(gameKey) {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let gameState = { running: false, paused: false };

            if (gameKey === 'snake') {
                initSnake(canvas, ctx, gameState);
            } else if (gameKey === 'galaga') {
                initGalaga(canvas, ctx, gameState);
            } else if (gameKey === 'breakout') {
                initBreakout(canvas, ctx, gameState);
            } else if (gameKey === 'flappy') {
                initFlappy(canvas, ctx, gameState);
            } else if (gameKey === 'pong') {
                initPong(canvas, ctx, gameState);
            }

            window.currentGameState = gameState;
        }

        // SNAKE GAME
        function initSnake(canvas, ctx, state) {
            const gridSize = 20;
            let snake = [{x: 10, y: 10}];
            let food = {x: 15, y: 15};
            let direction = {x: 1, y: 0};
            let nextDirection = {x: 1, y: 0};
            let score = 0;

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' && direction.y === 0) nextDirection = {x: 0, y: -1};
                if (e.key === 'ArrowDown' && direction.y === 0) nextDirection = {x: 0, y: 1};
                if (e.key === 'ArrowLeft' && direction.x === 0) nextDirection = {x: -1, y: 0};
                if (e.key === 'ArrowRight' && direction.x === 0) nextDirection = {x: 1, y: 0};
            });

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid
                ctx.strokeStyle = rgba(102, 192, 244, 0.1)';
                for (let i = 0; i <= canvas.width; i += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, canvas.height);
                    ctx.stroke();
                }

                // Snake
                ctx.fillStyle = '#4caf50';
                snake.forEach((segment, i) => {
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                });

                // Food
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

                // Score
                ctx.fillStyle = '#66c0f4';
                ctx.font = '16px Orbitron';
                ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);
            }

            function update() {
                if (!state.running || state.paused) return;

                direction = nextDirection;
                const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

                // Colisión con bordes
                if (head.x < 0 || head.x >= canvas.width / gridSize || 
                    head.y < 0 || head.y >= canvas.height / gridSize ||
                    snake.some(s => s.x === head.x && s.y === head.y)) {
                    state.running = false;
                    document.getElementById('gameInfo').textContent = `GAME OVER! Score: ${score}`;
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    food = {
                        x: Math.floor(Math.random() * (canvas.width / gridSize)),
                        y: Math.floor(Math.random() * (canvas.height / gridSize))
                    };
                } else {
                    snake.pop();
                }
            }

            function gameLoop() {
                update();
                draw();
                gameLoops[currentGame] = setTimeout(gameLoop, 100);
            }

            state.running = true;
            gameLoops[currentGame] = setTimeout(gameLoop, 100);
            draw();
        }

        // GALAGA GAME
        function initGalaga(canvas, ctx, state) {
            let player = {x: canvas.width / 2 - 20, y: canvas.height - 40, width: 40, height: 30};
            let bullets = [];
            let enemies = [];
            let score = 0;

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 5; j++) {
                    enemies.push({x: j * 70 + 30, y: i * 50 + 20, width: 40, height: 30, alive: true});
                }
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && player.x > 0) player.x -= 20;
                if (e.key === 'ArrowRight' && player.x < canvas.width - player.width) player.x += 20;
                if (e.key === ' ') {
                    bullets.push({x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 15});
                }
            });

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Player
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // Bullets
                ctx.fillStyle = '#ffff00';
                bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

                // Enemies
                ctx.fillStyle = '#ff2a85';
                enemies.forEach(e => {
                    if (e.alive) ctx.fillRect(e.x, e.y, e.width, e.height);
                });

                // Score
                ctx.fillStyle = '#66c0f4';
                ctx.font = '16px Orbitron';
                ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);
            }

            function update() {
                if (!state.running) return;

                // Mover balas
                bullets = bullets.filter(b => {
                    b.y -= 5;
                    return b.y > 0;
                });

                // Colisiones
                bullets.forEach((b, bi) => {
                    enemies.forEach((e, ei) => {
                        if (e.alive && b.x < e.x + e.width && b.x + b.width > e.x &&
                            b.y < e.y + e.height && b.y + b.height > e.y) {
                            e.alive = false;
                            bullets.splice(bi, 1);
                            score += 10;
                        }
                    });
                });

                // Enemigos muertos
                if (enemies.every(e => !e.alive)) {
                    state.running = false;
                    document.getElementById('gameInfo').textContent = `¡GANASTE! Score: ${score}`;
                }
            }

            function gameLoop() {
                update();
                draw();
                gameLoops[currentGame] = setTimeout(gameLoop, 50);
            }

            state.running = true;
            gameLoops[currentGame] = setTimeout(gameLoop, 50);
            draw();
        }

        // BREAKOUT GAME
        function initBreakout(canvas, ctx, state) {
            let paddle = {x: canvas.width / 2 - 40, y: canvas.height - 20, width: 80, height: 15};
            let ball = {x: canvas.width / 2, y: canvas.height - 50, radius: 8, dx: 4, dy: -4};
            let bricks = [];
            let score = 0;

            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push({x: j * 50, y: i * 20, width: 50, height: 20, alive: true});
                }
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && paddle.x > 0) paddle.x -= 30;
                if (e.key === 'ArrowRight' && paddle.x < canvas.width - paddle.width) paddle.x += 30;
            });

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Paddle
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

                // Ball
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Bricks
                ctx.fillStyle = '#ff2a85';
                bricks.forEach(b => {
                    if (b.alive) ctx.fillRect(b.x, b.y, b.width, b.height);
                });

                // Score
                ctx.fillStyle = '#66c0f4';
                ctx.font = '16px Orbitron';
                ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);
            }

            function update() {
                if (!state.running) return;

                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.dx *= -1;
                if (ball.y - ball.radius < 0) ball.dy *= -1;

                // Paddle
                if (ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy *= -1;
                }

                // Bricks
                bricks.forEach(b => {
                    if (b.alive && ball.x > b.x && ball.x < b.x + b.width &&
                        ball.y > b.y && ball.y < b.y + b.height) {
                        b.alive = false;
                        ball.dy *= -1;
                        score += 10;
                    }
                });

                if (ball.y > canvas.height) {
                    state.running = false;
                    document.getElementById('gameInfo').textContent = `GAME OVER! Score: ${score}`;
                }

                if (bricks.every(b => !b.alive)) {
                    state.running = false;
                    document.getElementById('gameInfo').textContent = `¡GANASTE! Score: ${score}`;
                }
            }

            function gameLoop() {
                update();
                draw();
                gameLoops[currentGame] = setTimeout(gameLoop, 30);
            }

            state.running = true;
            gameLoops[currentGame] = setTimeout(gameLoop, 30);
            draw();
        }

        // FLAPPY BIRD GAME
        function initFlappy(canvas, ctx, state) {
            let bird = {x: 50, y: 150, radius: 15, dy: 0};
            let pipes = [];
            let score = 0;
            let frameCount = 0;

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ') bird.dy = -8;
            });

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Bird
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                ctx.fill();

                // Pipes
                ctx.fillStyle = '#4caf50';
                pipes.forEach(p => {
                    ctx.fillRect(p.x, 0, p.width, p.top);
                    ctx.fillRect(p.x, p.top + p.gap, p.width, canvas.height - p.top - p.gap);
                });

                // Score
                ctx.fillStyle = '#66c0f4';
                ctx.font = '16px Orbitron';
                ctx.fillText(`Score: ${score}`, 10, canvas.height - 10);
            }

            function update() {
                if (!state.running) return;

                bird.dy += 0.4;
                bird.y += bird.dy;

                if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                    state.running = false;
                    document.getElementById('gameInfo').textContent = `GAME OVER! Score: ${score}`;
                    return;
                }

                frameCount++;
                if (frameCount % 80 === 0) {
                    let gap = 100;
                    let top = Math.random() * (canvas.height - gap - 100) + 50;
                    pipes.push({x: canvas.width, y: 0, width: 50, top: top, gap: gap});
                }

                pipes = pipes.filter(p => {
                    p.x -= 4;

                    if (p.x + p.width === bird.x) score++;

                    if (bird.x > p.x && bird.x < p.x + p.width) {
                        if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + p.gap) {
                            state.running = false;
                            document.getElementById('gameInfo').textContent = `GAME OVER! Score: ${score}`;
                        }
                    }

                    return p.x + p.width > 0;
                });
            }

            function gameLoop() {
                update();
                draw();
                gameLoops[currentGame] = setTimeout(gameLoop, 30);
            }

            state.running = true;
            gameLoops[currentGame] = setTimeout(gameLoop, 30);
            draw();
        }

        // PONG GAME
        function initPong(canvas, ctx, state) {
            let paddles = {
                left: {x: 10, y: canvas.height / 2 - 40, width: 10, height: 80},
                right: {x: canvas.width - 20, y: canvas.height / 2 - 40, width: 10, height: 80}
            };
            let ball = {x: canvas.width / 2, y: canvas.height / 2, radius: 8, dx: 5, dy: 5};
            let score = {left: 0, right: 0};

            document.addEventListener('keydown', (e) => {
                if (e.key === 'w' && paddles.left.y > 0) paddles.left.y -= 20;
                if (e.key === 's' && paddles.left.y < canvas.height - paddles.left.height) paddles.left.y += 20;
                if (e.key === 'ArrowUp' && paddles.right.y > 0) paddles.right.y -= 20;
                if (e.key === 'ArrowDown' && paddles.right.y < canvas.height - paddles.right.height) paddles.right.y += 20;
            });

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Paddles
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(paddles.left.x, paddles.left.y, paddles.left.width, paddles.left.height);
                ctx.fillRect(paddles.right.x, paddles.right.y, paddles.right.width, paddles.right.height);

                // Ball
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Score
                ctx.fillStyle = '#66c0f4';
                ctx.font = '16px Orbitron';
                ctx.fillText(`${score.left} - ${score.right}`, canvas.width / 2 - 20, 25);
            }

            function update() {
                if (!state.running) return;

                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) ball.dy *= -1;

                // Paddle collisions
                if (ball.x - ball.radius < paddles.left.x + paddles.left.width &&
                    ball.y > paddles.left.y && ball.y < paddles.left.y + paddles.left.height) {
                    ball.dx *= -1;
                }

                if (ball.x + ball.radius > paddles.right.x &&
                    ball.y > paddles.right.y && ball.y < paddles.right.y + paddles.right.height) {
                    ball.dx *= -1;
                }

                if (ball.x - ball.radius < 0) {
                    score.right++;
                    ball = {x: canvas.width / 2, y: canvas.height / 2, radius: 8, dx: 5, dy: 5};
                }

                if (ball.x + ball.radius > canvas.width) {
                    score.left++;
                    ball = {x: canvas.width / 2, y: canvas.height / 2, radius: 8, dx: -5, dy: 5};
                }
            }

            function gameLoop() {
                update();
                draw();
                gameLoops[currentGame] = setTimeout(gameLoop, 30);
            }

            state.running = true;
            gameLoops[currentGame] = setTimeout(gameLoop, 30);
            draw();
        }

        // CONTROLES
        function startGame() {
            if (window.currentGameState) window.currentGameState.running = true;
        }

        function pauseGame() {
            if (window.currentGameState) window.currentGameState.paused = !window.currentGameState.paused;
        }

        function closeGameModal() {
            document.getElementById('gameModal').classList.remove('active');
            if (gameLoops[currentGame]) clearTimeout(gameLoops[currentGame]);
        }

        function toggleCRT() {
            const overlay = document.getElementById('crtOverlay');
            const btn = document.getElementById('crtBtn');
            overlay.classList.toggle('disabled');
            btn.textContent = overlay.classList.contains('disabled') ? 'CRT: OFF' : 'CRT: ON';
        }

        // CHAT
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (message) {
                const messagesDiv = document.getElementById('chatMessages');
                const userMsg = document.createElement('div');
                userMsg.className = 'chat-message user';
                userMsg.textContent = message;
                messagesDiv.appendChild(userMsg);

                input.value = '';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // Respuesta simulada
                setTimeout(() => {
                    const botMsg = document.createElement('div');
                    botMsg.className = 'chat-message bot';
                    botMsg.textContent = '¡Hola! Soy el Asistente Indie Steam. ¿En qué puedo ayudarte hoy?';
                    messagesDiv.appendChild(botMsg);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 300);
            }
        }

        function handleChatKeypress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        // PERFIL
        function loadProfile() {
            const totalGames = userLibrary.length;
            const totalPlaytime = Object.values(games).reduce((sum, g) => sum + g.playtime, 0);
            
            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('totalPlaytime').textContent = totalPlaytime;
            document.getElementById('achievements').textContent = Math.floor(totalGames * 2);
        }

        // INICIALIZAR
        window.addEventListener('load', () => {
            loadStore();
        });
    </script>
